<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Photoshop / Figma Alpha Transparency Checkerboard -->
    <pattern id="alphaCheck" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f8fafc" />
      <rect width="12" height="12" fill="#cbd5e1" />
      <rect x="12" y="12" width="12" height="12" fill="#cbd5e1" />
    </pattern>
    <linearGradient id="cupGradAfter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="dropShadowAfter" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Transparent Background Checkerboard Grid -->
  <rect width="800" height="450" fill="url(#alphaCheck)" />

  <!-- Clean Extracted Cutout Subject (Zero Background / Pure Alpha) -->
  <g transform="translate(400, 240)" filter="url(#dropShadowAfter)">
    <path d="M-140,0 C-140,-130 140,-130 140,0" fill="none" stroke="#0f172a" stroke-width="22" stroke-linecap="round" />
    <path d="M-140,0 C-140,-130 140,-130 140,0" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M-75,-100 C-30,-120 30,-120 75,-100" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round" />
    <ellipse cx="-140" cy="20" rx="34" ry="58" fill="url(#cupGradAfter)" stroke="#1e293b" stroke-width="8" />
    <ellipse cx="-140" cy="20" rx="20" ry="38" fill="#0f172a" />
    <circle cx="-140" cy="20" r="10" fill="#38bdf8" opacity="0.8" />
    <ellipse cx="140" cy="20" rx="34" ry="58" fill="url(#cupGradAfter)" stroke="#1e293b" stroke-width="8" />
    <ellipse cx="140" cy="20" rx="20" ry="38" fill="#0f172a" />
    <circle cx="140" cy="20" r="10" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>