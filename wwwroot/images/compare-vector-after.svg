<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#f43f5e" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="#090d16" />

  <!-- Smooth Vector Coordinate Grid Lines (Infinite Precision) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.6">
    <circle cx="400" cy="215" r="80" fill="none" stroke-dasharray="4,4" />
    <circle cx="400" cy="215" r="140" fill="none" stroke-dasharray="4,4" />
    <circle cx="400" cy="215" r="190" fill="none" stroke-dasharray="4,4" />
    <line x1="150" y1="215" x2="650" y2="215" stroke-dasharray="4,4" />
    <line x1="400" y1="20" x2="400" y2="410" stroke-dasharray="4,4" />
  </g>

  <!-- Scalable Pure Mathematical Bezier Shield Path -->
  <g filter="url(#vectorGlow)">
    <path d="M400,60 C470,60 540,75 550,130 C560,230 460,320 400,360 C340,320 240,230 250,130 C260,75 330,60 400,60 Z"
          fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Inner Golden Crest Contour -->
    <path d="M400,90 C450,90 500,105 510,145 C518,220 440,290 400,325 C360,290 282,220 290,145 C300,105 350,90 400,90 Z"
          fill="#090d16" stroke="#fbbf24" stroke-width="3" stroke-linejoin="round" />

    <!-- Pure Vector 8-Point Star with Bezier Bevels -->
    <g transform="translate(400, 205)">
      <polygon points="0,-75 22,-22 75,0 22,22 0,75 -22,22 -75,0 -22,-22" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />
      <polygon points="0,-75 14,-14 75,0 14,14 0,75 -14,14 -75,0 -14,-14" fill="#f59e0b" />
      <circle cx="0" cy="0" r="14" fill="#ffffff" />
    </g>
  </g>

  <!-- Vector Anchor Points & Tangent Handles Representation -->
  <g fill="#38bdf8" stroke="#ffffff" stroke-width="1.5">
    <circle cx="400" cy="60" r="4.5" />
    <circle cx="550" cy="130" r="4.5" />
    <circle cx="400" cy="360" r="4.5" />
    <circle cx="250" cy="130" r="4.5" />
  </g>
  
  <text x="400" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="2" fill="#38bdf8" text-anchor="middle">PURE SVG BEZIER VECTORS • INFINITE SCALE</text>
</svg>