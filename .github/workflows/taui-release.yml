name: "TAUI Cross-Platform Desktop Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            target: 'universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Install Linux system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Compile minified Tailwind CSS
        run: npm run build:css

      - name: Publish Blazor WebAssembly demo
        run: dotnet publish -c Release -o dist

      - name: Build Tauri Desktop App & Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.release_tag || 'v1.0.0' }}
          releaseName: 'Blazor Tailwind UI Desktop v__VERSION__'
          releaseBody: |
            ## 🚀 Blazor Tailwind UI Desktop (TAUI) Enterprise Release
            
            Cross-platform native desktop release powered by TAUI (Tauri v2) and .NET 11 WebAssembly.
            
            ### Included Packages:
            - **Windows**: `.msi` (WiX installer) & `.exe` (NSIS setup)
            - **macOS**: `.dmg` & `.app` (Universal Binary: Apple Silicon + Intel)
            - **Linux**: `.deb` (Debian/Ubuntu) & `.AppImage` (Cross-distro portable)
            
            ### Features:
            - 137 native controls with 0 external CDN dependencies
            - Adaptive Generative UI (AGUI) Studio & Dual-Plane Tool Calling
            - Smart Components (Smart Paste, Smart Textarea, Smart Search, Smart Filter)
            - 100 Most Used Web Dev Forms Standard Library
            - Flagship Business Forms (Annual Operating Plan, P&L Statement, Employee Awards, Party Planner)
            - Developer Studio Suite (Dock Manager, Spreadsheet, Org Chart, Markdown Editor)
            - Financial Charts, Treemaps, OLAP Pivot Grids, Barcodes & Hardware Signatures
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
