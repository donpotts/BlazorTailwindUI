[package]
name = "blazor-tailwind-ui"
version = "0.6.0"
description = "Blazor Tailwind UI Enterprise Studio Desktop Application"
authors = ["Don Potts"]
license = "MIT"
repository = "https://github.com/donpotts/BlazorTailwindUI"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
